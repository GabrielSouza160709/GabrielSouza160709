<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Gabriel Souza — Software Engineering &amp; Applied AI">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1F2328" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="14" fill="#FFFFFF"/>
  <rect width="1200" height="260" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="260" rx="14" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="none" stroke="#D1D9E0"/>

  <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="14" letter-spacing="2" fill="#59636E">
    <text x="56" y="62"><tspan fill="#0F766E">GS</tspan> / SOFTWARE &amp; IA APLICADA</text>
  </g>
  <text x="54" y="138" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#1F2328">Gabriel Souza</text>
  <text x="56" y="176" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#59636E">Sistemas e agentes de IA para operações reais.</text>
  <text x="56" y="218" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="13" letter-spacing="1" fill="#818B98">TypeScript · Python · Go · LangGraph · MCP  —  Uberlândia, MG</text>

  <!-- processo → sistema → medição -->
  <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="13" text-anchor="middle">
    <path d="M790 130 H880 M960 130 H1050" stroke="#D1D9E0" stroke-width="2"/>
    <path d="M872 124 L882 130 L872 136 M1042 124 L1052 130 L1042 136" fill="none" stroke="#9198A1" stroke-width="2"/>
    <rect x="712" y="104" width="78" height="52" rx="10" fill="#F6F8FA" stroke="#D1D9E0"/>
    <text x="751" y="135" fill="#59636E">processo</text>
    <rect x="882" y="104" width="78" height="52" rx="10" fill="#F6F8FA" stroke="#D1D9E0"/>
    <text x="921" y="135" fill="#1F2328">sistema</text>
    <rect x="1052" y="104" width="94" height="52" rx="10" fill="#0F766E" fill-opacity="0.12" stroke="#0F766E"/>
    <text x="1099" y="135" fill="#0F766E">medido ✓</text>
    <text x="751" y="182" fill="#818B98" font-size="11">planilha · WhatsApp</text>
    <text x="921" y="182" fill="#818B98" font-size="11">código · agentes</text>
    <text x="1099" y="182" fill="#818B98" font-size="11">evals · testes</text>
  </g>
</svg>
